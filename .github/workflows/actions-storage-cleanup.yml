name: Actions storage cleanup

on:
  push:
    paths:
      - .github/workflows/actions-storage-cleanup.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel sibling runs started by this cleanup commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sleep 5
          for state in queued in_progress; do
            while IFS= read -r id; do
              [[ -z "${id}" || "${id}" == "${CURRENT_RUN_ID}" ]] && continue
              echo "Cancelling ${state} sibling run ${id}"
              gh api -X POST "repos/${REPO}/actions/runs/${id}/cancel" >/dev/null 2>&1 || true
            done < <(gh api --paginate "repos/${REPO}/actions/runs?head_sha=${COMMIT_SHA}&status=${state}&per_page=100" --jq '.workflow_runs[].id')
          done

      - name: Delete Actions artifacts and caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          clean_once() {
            local artifact_count=0 artifact_bytes=0 cache_count=0 cache_bytes=0
            local id size name

            while IFS=$'\t' read -r id size name; do
              [[ -z "${id}" ]] && continue
              echo "Deleting artifact ${name} (${size} bytes)"
              if gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}" >/dev/null 2>&1; then
                artifact_count=$((artifact_count + 1))
                artifact_bytes=$((artifact_bytes + size))
              fi
            done < <(gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id, .size_in_bytes, .name] | @tsv')

            while IFS=$'\t' read -r id size name; do
              [[ -z "${id}" ]] && continue
              echo "Deleting cache ${name} (${size} bytes)"
              if gh api -X DELETE "repos/${REPO}/actions/caches/${id}" >/dev/null 2>&1; then
                cache_count=$((cache_count + 1))
                cache_bytes=$((cache_bytes + size))
              fi
            done < <(gh api --paginate "repos/${REPO}/actions/caches?per_page=100" --jq '.actions_caches[] | [.id, .size_in_bytes, .key] | @tsv')

            echo "Deleted ${artifact_count} artifacts totaling ${artifact_bytes} bytes"
            echo "Deleted ${cache_count} caches totaling ${cache_bytes} bytes"
          }

          clean_once
          sleep 15
          clean_once
          echo "Remaining artifacts: $(gh api "repos/${REPO}/actions/artifacts?per_page=1" --jq '.total_count')"
          echo "Remaining caches: $(gh api "repos/${REPO}/actions/caches?per_page=1" --jq '.total_count')"

      - name: Remove this one-shot workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SELF_PATH: .github/workflows/actions-storage-cleanup.yml
        run: |
          set -euo pipefail
          self_sha="$(gh api "repos/${REPO}/contents/${SELF_PATH}?ref=${BRANCH}" --jq '.sha')"
          gh api -X DELETE "repos/${REPO}/contents/${SELF_PATH}" \
            -f message='chore: remove one-shot Actions cleanup' \
            -f sha="${self_sha}" \
            -f branch="${BRANCH}" >/dev/null
